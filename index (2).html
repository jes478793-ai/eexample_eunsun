<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원 피하기 게임 (Circle Dodge Game)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            overflow: hidden;
        }

        .glow-effect {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }

        .game-canvas-container {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .flash-active {
            animation: flashAnim 0.15s ease-out;
        }

        @keyframes flashAnim {
            0% {
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.6);
            }
            100% {
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 select-none">

    <div class="max-w-md w-full flex flex-col items-center">
        <!-- Header & Score Display -->
        <div class="w-full flex justify-between items-center mb-4 bg-slate-800/80 p-4 rounded-2xl border border-slate-700 backdrop-blur-md">
            <div>
                <div class="flex items-center gap-2 mb-0.5">
                    <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block">현재 점수</span>
                    <span id="levelBadge" class="text-[10px] bg-blue-500/20 text-blue-300 font-bold px-2 py-0.5 rounded-full border border-blue-500/30">Lv.1</span>
                </div>
                <span id="score" class="text-3xl font-extrabold text-blue-400">0.00s</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="bgmBtn" class="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-95 flex items-center justify-center text-slate-300 transition-all border border-slate-600" title="배경음악 토글">
                    <i id="bgmIcon" class="fa-solid fa-volume-high"></i>
                </button>
                <div class="text-right">
                    <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block">최고 기록</span>
                    <span id="highScore" class="text-2xl font-bold text-amber-400">0.00s</span>
                </div>
            </div>
        </div>

        <!-- Game Canvas Area -->
        <div class="game-canvas-container w-full aspect-[3/4] max-h-[60vh] bg-slate-900 rounded-2xl overflow-hidden border-2 border-slate-700 relative">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- State Overlay (Start Screen / Game Over Screen) -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
                <div id="overlayContent" class="flex flex-col items-center max-w-xs">
                    <div id="overlayIcon" class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mb-4 border border-blue-500/40 text-2xl">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <h1 id="overlayTitle" class="text-2xl font-extrabold text-white mb-2">원 피하기 게임</h1>
                    <div id="overlayDesc" class="text-slate-300 text-sm mb-6 leading-relaxed">
                        <p class="mb-2">하늘에서 떨어지는 장애물들을 피하세요!</p>
                        <div class="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700 text-xs text-slate-400">
                            <span class="text-blue-400 font-semibold">조작법:</span> 키보드 방향키 또는 하단 화살표 버튼
                        </div>
                    </div>
                    <button id="actionBtn" class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
                        <i id="actionBtnIcon" class="fa-solid fa-play text-sm"></i>
                        <span id="actionBtnText">게임 시작</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Touch Controls for Mobile Devices -->
        <div class="w-full grid grid-cols-3 gap-2 mt-4 md:hidden">
            <div></div>
            <button id="btnUp" class="bg-slate-800 border border-slate-700 active:bg-slate-700 p-4 rounded-xl text-center text-xl text-white font-bold flex justify-center items-center">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
            <div></div>
            <button id="btnLeft" class="bg-slate-800 border border-slate-700 active:bg-slate-700 p-4 rounded-xl text-center text-xl text-white font-bold flex justify-center items-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="btnDown" class="bg-slate-800 border border-slate-700 active:bg-slate-700 p-4 rounded-xl text-center text-xl text-white font-bold flex justify-center items-center">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button id="btnRight" class="bg-slate-800 border border-slate-700 active:bg-slate-700 p-4 rounded-xl text-center text-xl text-white font-bold flex justify-center items-center">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Controls Hint for Desktop -->
        <div class="mt-4 text-xs text-slate-400 hidden md:flex items-center gap-2 bg-slate-800/40 px-4 py-2 rounded-lg border border-slate-800">
            <i class="fa-solid fa-keyboard text-slate-500"></i>
            <span>조작법: 키보드 방향키 <span class="text-slate-200 font-semibold">↑ ↓ ← →</span> 이동</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.querySelector('.game-canvas-container');

        const scoreEl = document.getElementById('score');
        const levelBadgeEl = document.getElementById('levelBadge');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const actionBtn = document.getElementById('actionBtn');
        const actionBtnIcon = document.getElementById('actionBtnIcon');
        const actionBtnText = document.getElementById('actionBtnText');
        const bgmBtn = document.getElementById('bgmBtn');
        const bgmIcon = document.getElementById('bgmIcon');

        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Web Audio Synth for "BBANG!!" sound effect
        function playDodgeSound() {
            if (isMuted) return;
            initAudioContext();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                
                // 1. Synth Oscillator for punchy low impact
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);

                oscGain.gain.setValueAtTime(0.5, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.15);

                // 2. White Noise buffer for explosion pop
                const bufferSize = audioCtx.sampleRate * 0.1; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(1000, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.4, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start(now);
                noise.stop(now + 0.1);
            } catch(e) {
                console.log('Sound FX Error:', e);
            }
        }

        // Trigger visual flash and sound effect
        function triggerDodgeEffect() {
            playDodgeSound();

            canvasContainer.classList.remove('flash-active');
            void canvasContainer.offsetWidth; // Force reflow
            canvasContainer.classList.add('flash-active');

            setTimeout(() => {
                canvasContainer.classList.remove('flash-active');
            }, 150);
        }

        // State Machine Enum Definitions
        const GAME_STATE = {
            START_SCREEN: 'START_SCREEN',
            PLAYING: 'PLAYING',
            GAME_OVER: 'GAME_OVER'
        };

        let currentState = GAME_STATE.START_SCREEN;

        // BGM Setup
        const bgmAudio = new Audio('bgm.mp3');
        bgmAudio.loop = true;
        let isMuted = false;

        bgmBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            bgmAudio.muted = isMuted;
            if (isMuted) {
                bgmIcon.className = 'fa-solid fa-volume-xmark text-red-400';
            } else {
                bgmIcon.className = 'fa-solid fa-volume-high text-slate-300';
                if (currentState === GAME_STATE.PLAYING) {
                    bgmAudio.play().catch(() => {});
                }
            }
        });

        // Game State Variables
        let animationFrameId = null;
        let startTime = 0;
        let score = 0;
        let currentLevel = 1;
        let highScore = parseFloat(localStorage.getItem('dodge_game_highscore')) || 0;
        highScoreEl.innerText = highScore.toFixed(2) + 's';

        const player = {
            x: 0,
            y: 0,
            width: 60,
            height: 60,
            speed: 5
        };

        let obstacles = [];
        let lastSpawnTime = 0;

        // Assets
        const bgImg = new Image();
        bgImg.src = 'bg_2.png';
        let isBgImgLoaded = false;
        bgImg.onload = () => { isBgImgLoaded = true; };

        const obstacleImg = new Image();
        obstacleImg.src = 'wkddoanf_2.png';
        let isObstacleImgLoaded = false;
        obstacleImg.onload = () => { isObstacleImgLoaded = true; };

        // Keyboard & Touch State Management
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
        });

        // Touch control buttons
        const setupTouchBtn = (id, keyName) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const startHandler = (e) => { e.preventDefault(); keys[keyName] = true; };
            const endHandler = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener('touchstart', startHandler);
            btn.addEventListener('touchend', endHandler);
            btn.addEventListener('mousedown', startHandler);
            btn.addEventListener('mouseup', endHandler);
            btn.addEventListener('mouseleave', endHandler);
        };

        setupTouchBtn('btnLeft', 'left');
        setupTouchBtn('btnRight', 'right');
        setupTouchBtn('btnUp', 'up');
        setupTouchBtn('btnDown', 'down');

        function updatePlayerPosition() {
            if (keys.left && player.x > 0) player.x -= player.speed;
            if (keys.right && player.x < canvas.width - player.width) player.x += player.speed;
            if (keys.up && player.y > 0) player.y -= player.speed;
            if (keys.down && player.y < canvas.height - player.height) player.y += player.speed;
        }

        function drawPlayer() {
            ctx.save();
            ctx.font = '45px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👨‍🚀', player.x + player.width / 2, player.y + player.height / 2);
            ctx.restore();
        }

        function spawnObstacle() {
            const size = 60;
            const x = Math.random() * (canvas.width - size);
            const levelSpeedMultiplier = 1 + (currentLevel - 1) * 0.1;
            const baseSpeed = 3 + Math.random() * 2 + (score * 0.2);
            const speed = baseSpeed * levelSpeedMultiplier;
            const vx = (Math.random() - 0.5) * 2;
            obstacles.push({ x, y: -size, width: size, height: size, speed, vx });
        }

        function checkCollision(obs) {
            return (
                player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.height > obs.y
            );
        }

        // Canvas sizing initialization
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Reset state & variables for fresh restart
        function resetGame() {
            score = 0;
            currentLevel = 1;
            scoreEl.innerText = '0.00s';
            if (levelBadgeEl) levelBadgeEl.innerText = 'Lv.1';
            obstacles = [];
            player.x = (canvas.width - player.width) / 2;
            player.y = canvas.height - player.height - 30;
            startTime = performance.now();
            lastSpawnTime = startTime;
        }

        function enterPlayState() {
            resetGame();
            currentState = GAME_STATE.PLAYING;
            initAudioContext();

            // Play BGM
            bgmAudio.currentTime = 0;
            if (!isMuted) {
                bgmAudio.play().catch(e => console.log('Audio play failed:', e));
            }

            // Hide Overlay UI
            overlay.classList.add('opacity-0', 'pointer-events-none');

            // Start Main Game Loop
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function enterGameOverState() {
            currentState = GAME_STATE.GAME_OVER;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Pause BGM
            bgmAudio.pause();

            // Update High Score
            const isNewHighScore = score > highScore;
            if (isNewHighScore) {
                highScore = score;
                localStorage.setItem('dodge_game_highscore', highScore);
                highScoreEl.innerText = highScore.toFixed(2) + 's';
            }

            // Render Game Over Screen UI State
            overlayIcon.className = "w-16 h-16 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mb-4 border border-red-500/40 text-2xl";
            overlayIcon.innerHTML = `<i class="fa-solid fa-skull"></i>`;
            overlayTitle.innerText = "게임 오버!";
            overlayDesc.innerHTML = `
                <div class="bg-slate-800/90 p-4 rounded-xl border border-slate-700 w-full mb-3 space-y-2">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">달성 레벨</span>
                        <span class="text-lg font-bold text-indigo-400">Lv.${currentLevel}</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">최종 점수</span>
                        <span class="text-2xl font-extrabold text-blue-400">${score.toFixed(2)}초</span>
                    </div>
                    <div class="h-px bg-slate-700/60 w-full"></div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">최고 기록</span>
                        <span class="font-bold ${isNewHighScore ? 'text-amber-300 animate-pulse' : 'text-amber-400'}">${highScore.toFixed(2)}초 ${isNewHighScore ? '🎉 최고 기록 갱신!' : ''}</span>
                    </div>
                </div>
                <p class="text-xs text-slate-400">장애물과 부딪혔습니다.</p>
            `;
            actionBtnIcon.className = "fa-solid fa-rotate-right text-sm";
            actionBtnText.innerText = "다시하기";

            // Show Overlay
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function gameLoop(now) {
            if (currentState !== GAME_STATE.PLAYING) return;

            // Clear & Draw Background
            if (isBgImgLoaded) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Real-time Score Calculation (Duration survived)
            score = (now - startTime) / 1000;
            scoreEl.innerText = score.toFixed(2) + 's';

            // Level Calculation (Increases every 10 seconds)
            const newLevel = Math.floor(score / 10) + 1;
            if (newLevel !== currentLevel) {
                currentLevel = newLevel;
            }
            if (levelBadgeEl) {
                levelBadgeEl.innerText = `Lv.${currentLevel}`;
            }

            // Dynamic Difficulty Adjustment (Spawn speed & rate scales up over time)
            const dynamicSpawnRate = Math.max(120, 320 - (score * 8));
            if (now - lastSpawnTime > dynamicSpawnRate) {
                spawnObstacle();
                lastSpawnTime = now;
            }

            // Move & Draw Player
            updatePlayerPosition();
            drawPlayer();

            // Obstacle logic & collision handling
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed;
                obs.x += obs.vx;

                if (isObstacleImgLoaded) {
                    ctx.drawImage(obstacleImg, obs.x, obs.y, obs.width, obs.height);
                } else {
                    ctx.save();
                    ctx.font = '45px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('☄️', obs.x + obs.width / 2, obs.y + obs.height / 2 + 2);
                    ctx.restore();
                }

                // Check collision -> Game Over
                if (checkCollision(obs)) {
                    enterGameOverState();
                    return;
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    triggerDodgeEffect();
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Main Action Button Handler (Handles Start -> Playing & Game Over -> Restart transition)
        actionBtn.addEventListener('click', () => {
            if (currentState === GAME_STATE.START_SCREEN || currentState === GAME_STATE.GAME_OVER) {
                enterPlayState();
            }
        });

        // Initial setup draw
        player.x = (canvas.width - player.width) / 2;
        player.y = canvas.height - player.height - 30;
        
        if (isBgImgLoaded) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        drawPlayer();
    </script>
</body>
</html>
